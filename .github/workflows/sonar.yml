
name: SonarQube CI Pipeline

on:
  push:
    branches: [main, master, development]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarQube:
    name: SonarQube Scan and Gate
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Scan the project
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=MarkopsFinal
            -Dsonar.projectName=MarkopsFinal
            -Dsonar.sources=.

      # Step 3: Check the Quality Gate
      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Step 4: Publish unresolved issues to GitHub Actions Summary
      - name: Publish Unresolved Issue Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: MarkopsFinal
        shell: bash
        run: |
          set -u

          echo "## SonarQube Unresolved Issue Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${SONAR_TOKEN:-}" ] || \
             [ -z "${SONAR_HOST_URL:-}" ]; then
            echo "⚠️ SonarQube URL or token is missing." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_URL="${SONAR_HOST_URL%/}"
          API_URL="${BASE_URL}/api/issues/search"
          REPORT_URL="${BASE_URL}/dashboard?id=${SONAR_PROJECT_KEY}"

          echo "[Open full SonarQube dashboard](${REPORT_URL})" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Retrieve unresolved issues across all three software qualities.
          if ! curl --fail --silent --show-error --get \
            --connect-timeout 15 \
            --max-time 60 \
            --user "${SONAR_TOKEN}:" \
            -H "Bypass-Tunnel-Reminder: true" \
            -H "User-Agent: GitHub-Actions-SonarQube-Report" \
            --data-urlencode \
              "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode \
              "issueStatuses=OPEN,CONFIRMED" \
            --data-urlencode \
              "impactSoftwareQualities=SECURITY,RELIABILITY,MAINTAINABILITY" \
            --data-urlencode "ps=100" \
            "$API_URL" \
            --output sonar-issues.json; then

            echo "⚠️ Could not retrieve issues from SonarQube." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the server URL, token permissions, project key, and network/tunnel access." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          export SONAR_REPORT_URL="$REPORT_URL"

          # Format the API response as a Markdown report.
          node <<'NODE'
          const fs = require("fs");

          const summary = process.env.GITHUB_STEP_SUMMARY;
          const reportUrl = process.env.SONAR_REPORT_URL;
          const raw = fs.readFileSync("sonar-issues.json", "utf8");

          function md(value) {
            return String(value ?? "-")
              .replace(/\r?\n/g, " ")
              .replace(/\|/g, "\\|")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }

          let data;

          try {
            data = JSON.parse(raw);
          } catch {
            fs.appendFileSync(
              summary,
              "⚠️ SonarQube returned invalid JSON. " +
              "Check whether a proxy or tunnel returned an HTML page.\n"
            );
            process.exit(0);
          }

          if (!Array.isArray(data.issues)) {
            fs.appendFileSync(
              summary,
              "⚠️ The API response does not contain an issues list. " +
              "Check the SonarQube API response and permissions.\n"
            );
            process.exit(0);
          }

          const issues = data.issues;
          let output = "";

          output += `**Total matching unresolved issues: ${data.total ?? issues.length}**\n\n`;
          output += `Showing up to ${issues.length} issues in this report.\n\n`;

          output += "| Software Quality | Impact | File | Line | Issue Description |\n";
          output += "|---|---|---|---:|---|\n";

          if (issues.length === 0) {
            output += "| - | - | - | - | No matching unresolved issues returned |\n";
          } else {
            for (const issue of issues) {
              const impacts = Array.isArray(issue.impacts)
                ? issue.impacts
                : [];

              let quality = impacts
                .map(item => item.softwareQuality)
                .filter(Boolean)
                .join(", ");

              let impact = impacts
                .map(item => item.severity)
                .filter(Boolean)
                .join(", ");

              // Fall back to legacy fields when available.
              if (!quality) {
                quality = issue.type || "-";
              }

              if (!impact) {
                impact = issue.severity || "-";
              }

              const component = issue.component || "-";
              const file = component.includes(":")
                ? component.substring(component.indexOf(":") + 1)
                : component;

              const line = issue.line ?? "-";
              const message = md(issue.message);

              output += `| ${md(quality)} | ${md(impact)} | ${md(file)} | ${md(line)} | ${message} |\n`;
            }
          }

          output += "\n";
          output += `[Open full SonarQube report](${reportUrl})\n\n`;
          output += "_The API request is limited to 100 returned issues. The total may be larger._\n";

          fs.appendFileSync(summary, output);
          NODE

          echo "SonarQube issue report generation completed."
