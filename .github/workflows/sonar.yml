name: SonarQube CI Pipeline

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarQube:
    name: SonarQube Scan and Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=MarkopsFinal
            -Dsonar.projectName=MarkopsFinal
            -Dsonar.sources=.

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Display Unresolved Bugs in GitHub Logs (on failure)
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "=========================================================="
          echo " FAILED QUALITY GATE - UNRESOLVED BUGS / ISSUES:"
          echo "=========================================================="
          
          # Added 'Bypass-Tunnel-Reminder: true' to prevent Cloudflare quick tunnel from blocking the script
          curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
               -H "Bypass-Tunnel-Reminder: true" \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               "${{ secrets.SONAR_HOST_URL }}/api/issues/search?componentKeys=MarkopsFinal&resolved=false&ps=10" > sonar-issues.json
          
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("sonar-issues.json", "utf8");
            
            if (content.includes("<html>") || content.includes("Cloudflare")) {
              console.log("⚠️ Cloudflare Tunnel intercepted the automated API request.");
              console.log("👉 Please view your remaining bugs directly on your local dashboard:");
              console.log("   ${{ secrets.SONAR_HOST_URL }}/dashboard?id=MarkopsFinal");
            } else {
              try {
                const data = JSON.parse(content);
                if (data.issues && data.issues.length > 0) {
                  data.issues.forEach((issue, idx) => {
                    console.log(`\n${idx + 1}. Severity: [${issue.severity}] Type: [${issue.type}]`);
                    console.log(`   Message: ${issue.message}`);
                    console.log(`   File:    ${issue.component} (Line: ${issue.line || "N/A"})`);
                  });
                } else {
                  console.log("No open issues found or response was empty.");
                }
              } catch (e) {
                console.log("Failed to parse response. Check your Cloudflare tunnel connection.");
              }
            }
          '
          echo "=========================================================="
