name: SonarQube CI Pipeline

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarQube:
    name: SonarQube Scan and Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=MarkopsFinal
            -Dsonar.projectName=MarkopsFinal
            -Dsonar.sources=.

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Print Local Dashboard URL
        if: always()
        run: |
          echo "=========================================================="
          echo " View remaining bugs on your local/Cloudflare SonarQube:"
          echo " ${{ secrets.SONAR_HOST_URL }}/dashboard?id=MarkopsFinal"
          echo "=========================================================="
