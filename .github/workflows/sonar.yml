name: SonarQube CI Pipeline

on:
  push:
    branches: [main, master, development]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarQube:
    name: SonarQube Scan and Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=MarkopsFinal
            -Dsonar.projectName=MarkopsFinal
            -Dsonar.sources=.

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Publish Quality & Duplication Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: MarkopsFinal
        shell: bash
        run: |
          set -u
          echo "## SonarQube Quality & Duplication Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -z "${SONAR_TOKEN:-}" ] || [ -z "${SONAR_HOST_URL:-}" ]; then
            echo "⚠️ SonarQube URL or token is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          BASE_URL="${SONAR_HOST_URL%/}"
          
          # 1. Fetch Duplication Metrics
          DUP_API="${BASE_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=duplicated_lines_density,duplicated_lines,duplicated_blocks"
          curl --silent --show-error --get \
            --connect-timeout 15 --max-time 30 \
            --user "${SONAR_TOKEN}:" \
            -H "Bypass-Tunnel-Reminder: true" \
            -H "User-Agent: GitHub-Actions-SonarQube-Report" \
            "$DUP_API" --output sonar-duplication.json || true
          
          # 2. Fetch All Unresolved Issues (Security, Reliability, Maintainability, Bugs)
          API_URL="${BASE_URL}/api/issues/search"
          if ! curl --fail --silent --show-error --get \
            --connect-timeout 15 --max-time 60 \
            --user "${SONAR_TOKEN}:" \
            -H "Bypass-Tunnel-Reminder: true" \
            -H "User-Agent: GitHub-Actions-SonarQube-Report" \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100" \
            "$API_URL" \
            --output sonar-issues.json; then
            echo "⚠️ Could not retrieve issues from SonarQube." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          
          export SONAR_REPORT_URL="${BASE_URL}/dashboard?id=${SONAR_PROJECT_KEY}"
          
          node <<'NODE'
          const fs = require("fs");
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const reportUrl = process.env.SONAR_REPORT_URL;
          
          function md(value) {
            return String(value ?? "-")
              .replace(/\r?\n/g, " ")
              .replace(/\|/g, "\\|")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }
          
          // Parse Duplication Metrics
          let dupOutput = "### 📊 Code Duplication Metrics\n";
          try {
            const dupRaw = fs.readFileSync("sonar-duplication.json", "utf8");
            const dupData = JSON.parse(dupRaw);
            const measures = dupData.component?.measures || [];
            const getMetric = (key) => measures.find(m => m.metric === key)?.value ?? "N/A";
            const density = getMetric("duplicated_lines_density");
            const lines = getMetric("duplicated_lines");
            const blocks = getMetric("duplicated_blocks");
            dupOutput += `- **Duplicated Lines Density:** ${density}%\n`;
            dupOutput += `- **Duplicated Lines:** ${lines}\n`;
            dupOutput += `- **Duplicated Blocks:** ${blocks}\n\n`;
          } catch {
            dupOutput += "⚠️ Could not parse duplication metrics.\n\n";
          }
          fs.appendFileSync(summary, dupOutput);
          
          // Parse Issues (Security, Reliability, Maintainability, Bugs)
          let issueOutput = "### 🐛 Unresolved Issues (Security, Reliability, Maintainability & Bugs)\n";
          let rawIssues;
          try {
            rawIssues = fs.readFileSync("sonar-issues.json", "utf8");
          } catch {
            fs.appendFileSync(summary, "⚠️ Failed to read issues response file.\n");
            process.exit(0);
          }
          
          let data;
          try {
            data = JSON.parse(rawIssues);
          } catch {
            fs.appendFileSync(summary, "⚠️ SonarQube returned invalid JSON for issues.\n");
            process.exit(0);
          }
          
          const issues = data.issues || [];
          issueOutput += `**Total unresolved issues found:** ${data.total ?? issues.length}\n\n`;
          issueOutput += "| Type | Severity | File | Line | Description |\n";
          issueOutput += "|---|---|---|---:|---|\n";
          
          if (issues.length === 0) {
            issueOutput += "| - | - | - | - | No unresolved issues returned |\n";
          } else {
            for (const issue of issues) {
              const type = issue.type || "-";
              const severity = issue.severity || "-";
              const component = issue.component || "-";
              const file = component.includes(":") ? component.substring(component.indexOf(":") + 1) : component;
              const line = issue.line ?? "-";
              const message = md(issue.message);
              issueOutput += `| ${md(type)} | ${md(severity)} | ${md(file)} | ${line} | ${message} |\n`;
            }
          }
          issueOutput += "\n";
          issueOutput += `[Open full SonarQube report](${reportUrl})\n\n`;
          issueOutput += "_This report lists all unresolved security, reliability, maintainability, and bug issues._\n";
          fs.appendFileSync(summary, issueOutput);
          NODE
          
          echo "Report generation step completed."