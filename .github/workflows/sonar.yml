$yamlContent = @"
name: SonarQube CI Pipeline

on:
  push:
    branches: [main, master, development]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarQube:
    name: SonarQube Scan and Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: `${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: `${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=MarkopsFinal
            -Dsonar.projectName=MarkopsFinal
            -Dsonar.sources=.

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: `${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: `${{ secrets.SONAR_HOST_URL }}

      - name: Publish Unresolved Bug Report
        if: always()
        env:
          SONAR_TOKEN: `${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: `${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: MarkopsFinal
        shell: bash
        run: |
          set -u
          echo "## SonarQube Unresolved Bug Report" \
            >> "`$GITHUB_STEP_SUMMARY"
          echo "" >> "`$GITHUB_STEP_SUMMARY"
          if [ -z "`$SONAR_TOKEN:-" ] ||
             [ -z "`$SONAR_HOST_URL:-" ]; then
            echo "⚠️ SonarQube URL or token is missing." \
              >> "`$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE_URL="`${SONAR_HOST_URL%/}"
          API_URL="`$BASE_URL/api/issues/search"
          if ! curl --fail --silent --show-error --get \
            --connect-timeout 15 --max-time 60 \
            --user "`$SONAR_TOKEN:" \
            --header "Bypass-Tunnel-Reminder: true" \
            --header "User-Agent: GitHub-Actions-SonarQube-Report" \
            --data-urlencode \
              "componentKeys=`$SONAR_PROJECT_KEY" \
            --data-urlencode "resolved=false" \
            --data-urlencode "types=BUG" \
            --data-urlencode "ps=100" \
            "`$API_URL" \
            --output sonar-issues.json; then
            echo "⚠️ Could not retrieve issues from SonarQube." \
              >> "`$GITHUB_STEP_SUMMARY"
            echo "Check server connectivity, token permissions, and tunnel access." \
              >> "`$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export SONAR_REPORT_URL="`$BASE_URL/dashboard?id=`$SONAR_PROJECT_KEY"
          node <<'NODE'
          const fs = require("fs");
          const summary = process.env.GITHUB_STEP_SUMMARY;
          const reportUrl = process.env.SONAR_REPORT_URL;
          const raw = fs.readFileSync("sonar-issues.json", "utf8");
          function md(value) {
            return String(value ?? "-")
              .replace(/\r?\n/g, " ")
              .replace(/\|/g, "\\|")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;");
          }
          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            fs.appendFileSync(
              summary,
              "⚠️ SonarQube returned an invalid JSON response. " +
              "Check whether a proxy or Cloudflare tunnel returned HTML.\n"
            );
            process.exit(0);
          }
          if (!Array.isArray(data.issues)) {
            fs.appendFileSync(
              summary,
              "⚠️ The SonarQube response did not contain an issues list. " +
              "Check the API response and permissions.\n"
            );
            process.exit(0);
          }
          const issues = data.issues;
          let output = "";
          output += `**Unresolved bugs in this API response: ${data.total ?? issues.length}**\n\n`;
          output += "| Severity | File | Line | Bug description |\n";
          output += "|---|---|---:|---|\n";
          if (issues.length === 0) {
            output += "| - | - | - | No unresolved bugs returned |\n";
          } else {
            for (const issue of issues) {
              const file = issue.component || "-";
              const line = issue.line ?? "-";
              const message = md(issue.message);
              output += `| ${md(issue.severity)} | ${md(file)} | ${line} | ${message} |\n`;
            }
          }
          output += "\n";
          output += `[Open full SonarQube report](${reportUrl})\n\n`;
          output += "_This report lists unresolved bugs from the SonarQube API. " +
            "The API response is limited to 100 issues per run._\n";
          fs.appendFileSync(summary, output);
          NODE
          echo "Report generation step completed."
"@

Set-Content -Path ".github/workflows/sonar.yml" -Value $yamlContent -Encoding utf8
