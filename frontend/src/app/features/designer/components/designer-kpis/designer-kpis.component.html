<section class="kpi-grid">
  <!-- Card 1: Active Designers -->
  <div class="kpi-card card-purple">
    <div class="kpi-info-cluster">
      <span class="kpi-title">ACTIVE DESIGNERS</span>
      <div class="kpi-value">{{ totalDesigners }}</div>
    </div>
    <div class="kpi-squircle-icon icon-purple">
      <span class="material-symbols-outlined">group</span>
    </div>
  </div>

  <!-- Card 2: Assigned Tasks -->
  <div class="kpi-card card-amber">
    <div class="kpi-info-cluster">
      <span class="kpi-title">ASSIGNED TASKS</span>
      <div class="kpi-value">{{ totalTasks }}</div>
    </div>
    <div class="kpi-squircle-icon icon-amber">
      <span class="material-symbols-outlined">folder</span>
    </div>
  </div>

  <!-- Card 3: Pending Tasks -->
  <div class="kpi-card card-rose">
    <div class="kpi-info-cluster">
      <span class="kpi-title">PENDING TASKS</span>
      <div class="kpi-value">{{ totalPending }}</div>
    </div>
    <div class="kpi-squircle-icon icon-rose">
      <span class="material-symbols-outlined">pending_actions</span>
    </div>
  </div>

  <!-- Card 4: In-Progress Tasks -->
  <div class="kpi-card card-blue">
    <div class="kpi-info-cluster">
      <span class="kpi-title">IN-PROGRESS TASKS</span>
      <div class="kpi-value">{{ totalInProgress }}</div>
    </div>
    <div class="kpi-squircle-icon icon-blue">
      <span class="material-symbols-outlined">assignment</span>
    </div>
  </div>

  <!-- Card 5: Completed Tasks -->
  <div class="kpi-card card-emerald">
    <div class="kpi-info-cluster">
      <span class="kpi-title">COMPLETED TASKS</span>
      <div class="kpi-value">{{ totalCompleted }}</div>
    </div>
    <div class="kpi-squircle-icon icon-emerald">
      <span class="material-symbols-outlined">check_circle</span>
    </div>
  </div>
</section>
