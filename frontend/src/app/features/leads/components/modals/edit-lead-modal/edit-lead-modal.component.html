@if (isOpen && lead) {
  <div class="modal-backdrop" (click)="onClose()" (keydown.enter)="onClose()" (keydown.space)="onClose()" (keydown.escape)="onClose()" tabindex="0" role="button" aria-label="Close edit lead modal">
    <div class="modal-card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Edit lead dialog">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-squircle-icon">
            <span class="material-symbols-outlined">edit</span>
          </div>
          <div>
            <h2>Edit Lead Details</h2>
            <p class="modal-sub">
              Created by {{ lead.creatorName || 'You' }} &bull; Only the creator can modify this lead
            </p>
          </div>
        </div>
        <button
          class="btn-close-modal"
          (click)="onClose()"
          aria-label="Close"
          type="button"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        @if (editLeadError) {
          <div class="form-alert-error">
            {{ editLeadError }}
          </div>
        }
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadFirstName">First Name <span class="required">*</span></label>
            <input
              type="text"
              id="editLeadFirstName" [ngModel]="editFirstName"
              (ngModelChange)="editFirstNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Rahul"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadLastName">Last Name</label>
            <input
              type="text"
              id="editLeadLastName" [ngModel]="editLastName"
              (ngModelChange)="editLastNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Sharma"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadPhone">Phone Number <span class="required">*</span></label>
            <input
              type="text"
              id="editLeadPhone" [ngModel]="editPhone"
              (ngModelChange)="editPhoneChange.emit($event)"
              class="form-input"
              placeholder="+91 9876543210"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadEmail">Email Address</label>
            <input
              type="email"
              id="editLeadEmail" [ngModel]="editEmail"
              (ngModelChange)="editEmailChange.emit($event)"
              class="form-input"
              placeholder="user@example.com"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadSource">Lead Source</label>
            <input
              type="text"
              id="editLeadSource" [ngModel]="editSource"
              (ngModelChange)="editSourceChange.emit($event)"
              class="form-input"
              placeholder="e.g. Digital Ads, Facebook"
            />
          </div>
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadCampaign">Campaign Name</label>
            <input
              type="text"
              id="editLeadCampaign" [ngModel]="editCampaignName"
              (ngModelChange)="editCampaignNameChange.emit($event)"
              class="form-input"
              placeholder="e.g. Careermate Intake"
            />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadStatus">Current Pipeline Status</label>
            <select id="editLeadStatus" [ngModel]="editStatus" (ngModelChange)="editStatusChange.emit($event)" class="form-input">
              <option value="NEW">NEW</option>
              <option value="ASSIGNED">ASSIGNED</option>
              <option value="CONTACTED">CONTACTED</option>
              <option value="FOLLOW_UP">FOLLOW UP</option>
              <option value="INTERESTED">INTERESTED</option>
              <option value="NOT_INTERESTED">NOT INTERESTED</option>
              <option value="PAID">PAID</option>
              <option value="WRONG_NUMBER">WRONG NUMBER</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label class="form-label" for="editLeadAssignedTo">Assigned Telecaller</label>
            <select id="editLeadAssignedTo" [ngModel]="editAssignedTo" (ngModelChange)="editAssignedToChange.emit($event)" class="form-input">
              <option value="">Unassigned</option>
              @for (user of realUsersList; track user.id) {
                <option [value]="user.id">
                  {{ user.fullName }}
                </option>
              }
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          class="btn-action-secondary"
          (click)="onClose()"
          [disabled]="isSavingEdit"
          type="button"
        >
          Cancel
        </button>
        <button
          class="btn-action-primary"
          (click)="onSave()"
          [disabled]="isSavingEdit"
          type="button"
        >
          @if (!isSavingEdit) {
            <span class="material-symbols-outlined fs-16">check</span>
          }
          <span>{{ isSavingEdit ? 'Saving...' : 'Save Changes' }}</span>
        </button>
      </div>
    </div>
  </div>
}
