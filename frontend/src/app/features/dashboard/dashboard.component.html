<div class="dashboard-page-wrapper">
  <div class="dashboard-content-container">

    <header class="dashboard-hero-header">
      <h1 class="hero-main-title">OUR PRODUCTS</h1>
    </header>

    <section class="products-grid-section" aria-label="MarkOps Products">
      <div class="products-grid">
        @for (pkg of fixedPackages(); track pkg.id) {
          <div
            class="product-card"
            (click)="openPackage(pkg.shortName || pkg.name)"
            (keydown.enter)="openPackage(pkg.shortName || pkg.name)"
            (keydown.space)="openPackage(pkg.shortName || pkg.name)"
            tabindex="0"
            [attr.aria-label]="'Explore ' + getCardTitle(pkg)"
          >
            <div class="product-emblem-badge">
              <img [src]="pkg.image" [alt]="getCardTitle(pkg) + ' Logo'" class="emblem-logo-img" />
            </div>

            <div class="card-body-content">
              <h2 class="card-product-title">{{ getCardTitle(pkg) }}</h2>
            </div>
          </div>
        }
      </div>
    </section>

  </div>
</div>
