<div class="dept-operations-container">
  @if (operationDepartments.length > 0) {
    <div class="dept-operations-grid">
      @for (dept of operationDepartments; track dept.id) {
        <div
          class="dept-operation-card"
          (click)="onSelectDepartment(dept.id)"
          (keydown.enter)="onSelectDepartment(dept.id)"
          (keydown.space)="onSelectDepartment(dept.id)"
          [attr.aria-label]="'Select ' + dept.label + ' department'"
          [attr.data-dept-id]="dept.id"
        >
          <div class="dept-icon-squircle">
            @if (dept.id === 'DESIGNER') {
              <!-- Designer: Palette Icon matching Image 3 -->
              <svg viewBox="0 0 24 24" class="dept-svg-icon">
                <path d="M12 2C6.49 2 2 6.49 2 12c0 4.41 3.59 8 8 8 1.1 0 2-.9 2-2 0-.49-.18-.96-.51-1.34-.32-.37-.49-.84-.49-1.33 0-1.1.9-2 2-2h2.38c3.65 0 6.62-2.97 6.62-6.63C22 5.09 17.51 2 12 2zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8s1.5.67 1.5 1.5S7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5S18.33 11 17.5 11z" fill="#000000"/>
              </svg>
            } @else if (dept.id === 'DIGITAL_MARKETING') {
              <!-- Digital Marketing: Megaphone Icon matching Image 3 -->
              <svg viewBox="0 0 24 24" class="dept-svg-icon">
                <path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h1.2l.8 5.5h2l-.8-5.5H8.5l6 4.5V6.5l-6 4.5H4zm13.5 1.5c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM15 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="#000000"/>
              </svg>
            } @else if (dept.id === 'TELECALLING') {
              <!-- Telecalling: Phone with Broadcast Waves matching Image 3 -->
              <svg viewBox="0 0 24 24" class="dept-svg-icon">
                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.43-3.9-6.82-6.82l1.97-1.57c.27-.27.35-.65.24-1.01A11.36 11.36 0 0 1 8.73 4c0-.55-.45-1-1-1H4.21c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.62c0-.55-.45-1-1-1z" fill="#000000"/>
                <path d="M14.5 4.5c2.2.7 3.8 2.3 4.5 4.5M16.5 1.5c3.5 1.1 6.2 3.8 7.3 7.3" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
              </svg>
            } @else {
              <!-- Analytics & Management: Bar Chart with Trend Line matching Image 3 -->
              <svg viewBox="0 0 24 24" class="dept-svg-icon">
                <rect x="3" y="13" width="3.5" height="8" rx="1" fill="#000000"/>
                <rect x="10.25" y="9" width="3.5" height="12" rx="1" fill="#000000"/>
                <rect x="17.5" y="5" width="3.5" height="16" rx="1" fill="#000000"/>
                <path d="M4 11l7-4 7-3" stroke="#000000" stroke-width="2" stroke-linecap="round" fill="none"/>
                <circle cx="4" cy="11" r="1.5" fill="#000000"/>
                <circle cx="11" cy="7" r="1.5" fill="#000000"/>
                <circle cx="18" cy="4" r="1.5" fill="#000000"/>
              </svg>
            }
          </div>

          <h3 class="dept-title">{{ dept.label }}</h3>
        </div>
      }
    </div>
  }
</div>
